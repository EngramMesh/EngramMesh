[project]
name = "engrammesh-services"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = [
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"
