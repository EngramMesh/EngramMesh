[project]
name = "engrammesh-services"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115,<1",
    "pydantic>=2.13,<3",
    "pydantic-settings>=2.12,<3",
    "psycopg[binary,pool]>=3.2,<4",
    "PyJWT[crypto]>=2.10,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "mypy>=1.19,<2",
    "pytest>=9,<10",
    "pytest-asyncio>=1.3,<2",
    "ruff>=0.14,<1",
]

[tool.pytest.ini_options]
asyncio_mode = "strict"
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "postgres: requires ENGRAMMESH__POSTGRES__DSN or test fixture DSN",
    "xdist_group(name): assign tests to a pytest-xdist group for serial execution",
]

[tool.mypy]
python_version = "3.14"
strict = true

[tool.ruff]
target-version = "py314"
